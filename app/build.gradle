plugins { id 'com.android.application' }
// Optional scratch directory for constrained CI; regular builds still use app/build.
if (project.hasProperty('simpleTtsBuildDir')) {
 layout.buildDirectory = file(project.property('simpleTtsBuildDir'))
}
android {
 namespace 'org.retro.flitetts'
 compileSdk 36
 ndkVersion '29.0.14206865'
 defaultConfig {
  applicationId 'org.oldtts.android'
  testInstrumentationRunner 'org.retro.flitetts.StandaloneInstrumentation'
  minSdk 26
  targetSdk 36
  versionCode 12
  versionName '1.9.0'
  ndk { abiFilters.addAll(((project.findProperty('simpleTtsAbis') ?: 'arm64-v8a,armeabi-v7a,x86_64,x86') as String).split(',')*.trim()) }
  externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'; cFlags '-O2','-g0'; cppFlags '-O2','-g0' } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 buildTypes { release { minifyEnabled false } }
 packaging { jniLibs { useLegacyPackaging = true } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.0'
 implementation files('libs/freetts.jar','libs/cmu_us_kal.jar','libs/cmulex.jar','libs/cmudict04.jar','libs/en_us.jar')
}
